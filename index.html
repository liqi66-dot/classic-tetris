<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>CLASSIC TETRIS</h1>

<div id="startScreen">
    <h2>准备好了吗？</h2>
    <button id="startButton">开始游戏</button>
</div>

<div class="info">
    <p>成绩: <span id="score">0</span></p>
    <p>等级: <span id="level">1</span></p>
    <p>最高分: <span id="highScore">0</span></p>
</div>

<!-- 游戏区域 -->
<div id="gameArea">

    <!-- 游戏 -->
    <canvas id="game" width="300" height="600"></canvas>

    <!-- 右边区域 -->
    <div class="rightSide">

        <!-- 下一个方块 -->
        <div id="nextBox">
            <h3>下一个</h3>
            <canvas id="next" width="120" height="120"></canvas>
        </div>

        <!-- 手机控制 -->
        <div id="mobileControls">

            <button id="rotateButton">🔄</button>

            <div class="directionButtons">
                <button id="leftButton">⬅️</button>
                <button id="downButton">⬇️</button>
                <button id="rightButton">➡️</button>
            </div>

            <button id="dropButton">⬇️ 硬降</button>

        </div>

    </div>

</div>

<!-- 重新游戏 / 暂停 -->
<div class="mainButtons">
    <button id="restartButton">重新游戏</button>
    <button id="pauseButton">暂停</button>
</div>

<!-- 电脑操作说明 -->
<div class="controls">
    <p>⬅️ ➡️ 移动</p>
    <p>⬇️ 加速</p>
    <p>空格键硬降</p>
    <p>⬆️ 旋转</p>
    <p>R 重新游戏</p>
</div>

<script src="game.js"></script>

</body>
</html>
