<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Classic Snake</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- ====================
             游戏标题
        ==================== -->

        <h1>🐍 CLASSIC SNAKE</h1>


        <!-- ====================
             游戏资料
        ==================== -->

        <div class="game-info">

            <div>
                Score
                <span id="score">0</span>
            </div>

            <div>
                High Score
                <span id="highScore">0</span>
            </div>

            <div>
                Level
                <span id="level">1</span>
            </div>

        </div>


        <!-- ====================
             游戏画面
        ==================== -->

        <div class="game-board">

            <canvas
                id="gameCanvas"
                width="400"
                height="400"
            ></canvas>

            <div id="eatEffect" class="eat-effect hidden">
    +1
</div>

            <div id="newHighScore" class="new-high-score hidden">
    🏆 NEW HIGH SCORE!
</div>


            <!-- ====================
                 开始画面
            ==================== -->

            <div
                id="startScreen"
                class="game-screen"
            >

                <div class="screen-title">
                    🐍
                </div>

                <h2>CLASSIC SNAKE</h2>

               <p class="game-description">
    Eat the food 🍎<br>
    Grow longer 🐍<br>
    Get the highest score! 🏆
</p>

<div class="instructions">
    <strong>HOW TO PLAY</strong>
    <p>💻 Arrow Keys</p>
    <p>📱 Swipe or Buttons</p>
</div>

                <button id="startButton">
                    ▶ START GAME
                </button>

            </div>


            <!-- ====================
                 Game Over
            ==================== -->

            <div
                id="gameOverScreen"
                class="game-screen hidden"
            >

                <div class="screen-title">
                    💀
                </div>

                <h2>GAME OVER</h2>

                <p>
                    Score:
                    <strong id="finalScore">0</strong>
                </p>

                <p>
                    High Score:
                    <strong id="finalHighScore">0</strong>
                </p>

                <button id="restartButton">
                    🔄 PLAY AGAIN
                </button>

            </div>

        </div>


        <!-- ====================
             游戏按钮
        ==================== -->

        <div class="game-buttons">

            <button
                id="pauseButton"
            >
                ⏸ Pause
            </button>

        </div>


        <!-- ====================
             手机控制
        ==================== -->

        <div class="controls">

            <button id="upButton">
                ⬆️
            </button>

            <div class="middle-buttons">

                <button id="leftButton">
                    ⬅️
                </button>

                <button id="downButton">
                    ⬇️
                </button>

                <button id="rightButton">
                    ➡️
                </button>

            </div>

        </div>

    </div>


    <script src="game.js"></script>

</body>

</html>
